[package]
name = "poker-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
serde_json = "1"

[dependencies.eframe]
version = "0.31"
optional = true

[dependencies.egui]
version = "0.31"
optional = true

[dependencies.egui_extras]
version = "0.31"
optional = true
features = ["image", "file"]

[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["png"]

[features]
gui = ["eframe", "egui", "egui_extras", "image"]
